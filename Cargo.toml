[package]
name        = "wgsl-fft"
version     = "0.3.1"
edition     = "2021"
description = "GPU-accelerated FFT using Webgpu compute shaders"
license     = "MIT"
repository  = "https://github.com/larsjoost/wgsl-fft"
readme      = "README.md"
keywords    = ["fft", "gpu", "wgpu", "compute", "signal-processing"]
categories  = ["algorithms", "science", "multimedia"]

[lib]
name = "wgsl_fft"
path = "src/lib.rs"

[dependencies]
wgpu        = "29"
bytemuck    = { version = "1", features = ["derive"] }
pollster    = "0.4"
num-complex = "0.4"
rustfft     = "6"

cudarc = { version = "0.19.4", optional = true, default-features = false, features = ["std", "driver", "cufft", "dynamic-loading", "cuda-12000"] }
rocm-rs = { version = "0.5.1", optional = true }

[features]
default = []
cuda = ["dep:cudarc"]
rocm = ["rocm-rs"]
hipfft = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "fft_benchmark"
harness = false
